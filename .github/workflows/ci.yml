name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ------------------------------------------------------------
  # 1. Linting — ruff verifica estilo e erros de código
  # ------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/*/pyproject.toml
            libs/*/pyproject.toml

      - name: Instalar ruff
        run: pip install ruff

      - name: Verificar erros de lint
        run: ruff check .

      - name: Verificar formatação
        run: ruff format --check .

  # ------------------------------------------------------------
  # 2. Type-check — mypy verifica anotações de tipos
  # ------------------------------------------------------------
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/*/pyproject.toml
            libs/*/pyproject.toml

      - name: Instalar bibliotecas compartilhadas
        run: |
          pip install -e libs/common
          pip install -e libs/clients

      - name: Instalar apps e mypy
        run: |
          pip install -e apps/api
          pip install -e apps/ingestion
          pip install -e apps/processor
          pip install -e apps/maintenance
          pip install mypy

      - name: Verificar tipos
        run: |
          mypy apps/api/src apps/ingestion/src apps/processor/src apps/maintenance/src \
            libs/common libs/clients orchestrate_prefect.py

  # ------------------------------------------------------------
  # 3. Testes unitários — pytest por app
  # ------------------------------------------------------------
  test:
    name: Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: api
            working-directory: apps/api
            cov-source: src
            cov-fail-under: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/${{ matrix.project }}/pyproject.toml

      - name: Instalar dependências de teste
        working-directory: ${{ matrix.working-directory }}
        run: pip install -e ".[dev]"

      - name: Executar testes
        working-directory: ${{ matrix.working-directory }}
        run: |
          pytest tests/ \
            --cov=${{ matrix.cov-source }} \
            --cov-report=term-missing \
            --cov-fail-under=${{ matrix.cov-fail-under }}
        env:
          APP_NAME: LicitaFacil API Test
          SECRET_KEY: fake-secret-key-for-ci-tests-only
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "120"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          RESET_TOKEN_EXPIRE_HOURS: "1"
          RESET_CODE_EXPIRE_MINUTES: "15"
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: fake-supabase-key
          SMTP_HOST: localhost
          SMTP_PORT: "587"
          SMTP_USER: test@example.com
          SMTP_PASSWORD: fake-password
          EMAIL_FROM: test@example.com
          FRONTEND_URL: http://localhost:3000
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
          IBGE_API_URL: https://servicodados.ibge.gov.br/api/v1/localidades
          CNPJA_API_URL: https://open.cnpja.com

  # ------------------------------------------------------------
  # 4. Docker build — valida imagens de cada serviço
  # ------------------------------------------------------------
  docker-build:
    name: Docker Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prefect-worker
            context: .
            file: Dockerfile
          - name: api
            context: apps/api
            file: apps/api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: licitafacil-${{ matrix.name }}:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------
  # 5. Segurança — pip-audit escaneia CVEs nas dependências
  #                bandit verifica vulnerabilidades no código (OWASP Top 10)
  # ------------------------------------------------------------
  security:
    name: Security Scan (pip-audit & bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/*/pyproject.toml
            libs/*/pyproject.toml

      - name: Instalar dependências de runtime do monorepo
        run: |
          pip install -e libs/common
          pip install -e libs/clients
          pip install -e apps/api
          pip install -e apps/ingestion
          pip install -e apps/processor
          pip install -e apps/maintenance
          pip install pip-audit "bandit[toml]"

      - name: Escanear dependências por vulnerabilidades conhecidas
        run: pip-audit

      - name: Analisar código com bandit
        run: bandit -r apps/ libs/ orchestrate_prefect.py -f json -o bandit-report.json || true

      - name: Exibir relatório do bandit
        run: bandit -r apps/ libs/ orchestrate_prefect.py --format screen
