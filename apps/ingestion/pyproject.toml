[project]
name = "licitafacil-ingestion"
version = "1.0.0"
description = "Bronze layer - PNCP data ingestion"
requires-python = ">=3.11"

dependencies = [
    "licitafacil-common",
    "licitafacil-clients",
    "kafka-python>=2.0.2",
    "pymongo>=4.9",
    "requests>=2.31.0",
    "prefect>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ingestion = "main:main"