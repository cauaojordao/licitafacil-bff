version: '3.8'

services:
  # MongoDB - Bronze Layer
  mongodb:
    image: mongo:7.0
    container_name: licitafacil-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db
    networks:
      - licitafacil

  # Kafka & Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: licitafacil-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - licitafacil

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: licitafacil-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - licitafacil

  # Consumer (Bronze)
  consumer:
    build:
      context: ../../
      dockerfile: apps/consumer/Dockerfile
    container_name: licitafacil-consumer
    depends_on:
      - mongodb
      - kafka
    env_file:
      - ../../.env
    networks:
      - licitafacil
    restart: unless-stopped

  # Spark Streaming (Silver)
  spark:
    build:
      context: ../../
      dockerfile: apps/spark/Dockerfile
    container_name: licitafacil-spark
    depends_on:
      - kafka
    env_file:
      - ../../.env
    networks:
      - licitafacil
    restart: unless-stopped

  # Cronjobs (Maintenance)
  cronjob:
    build:
      context: ../../
      dockerfile: apps/cronjob/Dockerfile
    container_name: licitafacil-cronjob
    env_file:
      - ../../.env
    networks:
      - licitafacil
    restart: unless-stopped
    volumes:
      - iceberg_data:/tmp/iceberg-warehouse

volumes:
  mongodb_data:
  iceberg_data:

networks:
  licitafacil:
    driver: bridge
